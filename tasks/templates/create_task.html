{% extends 'base.html' %} {% block content %}

<main>
    <div class="row">
        <div class="col-md-4 offset-md-4 mt-5 ">
            <form method="POST" class="card card-body">
                <h1>Crea tarea </h1>

                {% csrf_token %} 
                
                {{ form.as_p }}
                <button class="btn btn-primary" type="submit">Crear tarea</button>
                {% if error %}
                <p style="color: red">{{ error }}</p>
                {% endif %}
                
                </form>
        </div>
    </div>
</main>


{% endblock %}
