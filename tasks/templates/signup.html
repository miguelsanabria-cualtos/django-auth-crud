{% extends 'base.html' %} {% block content %}



<main>
  <div class="row">
    <div class="col-md-4 offset-md-4 mt-5 ">
        <form method="POST" class="card card-body">
            <h1 class="text-center">Signup</h1>
            {% csrf_token %} 
            
           <div class="mb-3">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" class="form-control" placeholder="Nombre del usuario" required>
            </div>
            <div class="mb-3">
            <label for="password1">Contraseña</label>
            <input type="password" name="password1" id="password1" class="form-control" placeholder="Contraseña" required>
            </div>
            <div class="mb-3">
            <label for="password2">Confirmar contraseña</label>
            <input type="password" name="password2" id="password2" class="form-control" placeholder="Confirmar contraseña" required>
            </div>

            <button class="btn btn-primary" type="submit">Sign Up</button>
            {% if error %}
            <p style="color: red">{{ error }}</p>
            {% endif %}
          </form>
    </div>
  </div>
</main>

{% endblock %}
